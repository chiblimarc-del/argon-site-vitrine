# =============================================================================
# Site vitrine Argon — vérification automatique.
#
# ⚠️ CE WORKFLOW NE DÉPLOIE RIEN, ET NE DOIT JAMAIS LE FAIRE.
#
# Le site vitrine se met en ligne à la main, depuis le poste :
#   npm run deploy:ouvrir  →  scp -r dist/. root@164.132.76.117:…
# C'est délibéré — la clé SSH du VPS vit sur le poste et n'a aucune raison
# d'entrer dans les secrets GitHub. Ce workflow ne fait qu'une chose : dire si
# un commit passe les contrôles du projet, AVANT que quelqu'un lance le `scp`.
#
# Jusqu'au 26/08/2026, ce dépôt n'avait aucune CI : `npm run check` ne tournait
# que si l'on pensait à le taper. Rien n'empêchait de déployer un site dont un
# titre dépassait 60 caractères, ou dont la table des métiers de `demande.php`
# avait divergé du registre de routes.
#
# ⚠️ Volontairement SANS `paths-ignore: '**.md'`. Le dépôt SaaS porte ce filtre
# et en paie le prix : un lot de commits purement documentaires y fait avancer
# `master` sans que le staging bouge, et le garde-fou de production refuse
# ensuite ce HEAD. Ici, une exécution coûte une minute — moins cher qu'une
# exception à retenir.
# =============================================================================

name: Vérification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Un push qui en remplace un autre annule la vérification devenue inutile.
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: check + build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ⚠️ Les deux actions sont en @v5 depuis le 03/09/2026. Les @v4 tournaient
      # sur Node 20, déprécié : le runner les forçait déjà sur Node 24 en
      # l'annonçant à chaque exécution, et cette compatibilité finira par être
      # retirée. Les v5 n'apportent que ce passage à Node 24 — elles exigent en
      # retour un runner ≥ 2.327.1, ce que `ubuntu-latest` dépasse largement.
      #
      # Rien d'autre ne change ICI, et c'est vérifié : la cassure de
      # checkout@v5.1 (`allow-unsafe-pr-checkout`) ne porte que sur
      # `pull_request_target` et `workflow_run`, que ce workflow n'emploie pas ;
      # et le cache automatique de setup-node@v5 ne s'arme qu'en présence d'un
      # champ `packageManager` dans `package.json`, absent ici — le `cache: npm`
      # ci-dessous reste donc le seul en vigueur.
      - uses: actions/checkout@v5

      # `package.json` déclare `engines: node >=22.6`. La borne n'est pas
      # décorative : `scripts/seo-check.ts` et `scripts/deploy.ts` sont lancés
      # par `node --experimental-strip-types`, qui n'existe pas avant 22.6.
      #
      # ⚠️ Ne PAS confondre avec le Node 24 des actions ci-dessus : celui-là
      # fait tourner les actions elles-mêmes, celui-ci le code du projet.
      - uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      # Le contrôle qui fait foi : typecheck → lint → seo:check → tests.
      # Le déploiement échoue si l'un tombe ; la CI doit tomber pareil.
      - name: npm run check
        run: npm run check

      # Les tests du formulaire, en PHP.
      #
      # PHP 8.3 est installé sur le poste depuis le 03/09/2026 : ces tests y
      # tournent aussi, et le parcours complet du formulaire avec eux
      # (`npm run apercu`). La CI reste le filet qui ne dépend d'aucun poste —
      # d'où le `php -v` qui précède : une version de PHP absente ferait
      # autrement passer le pas en silence, et personne ne verrait que plus
      # rien n'est vérifié.
      #
      # Ils éprouvent les décisions de deploy/api/demande-controles.php, dont
      # celle qui a coûté deux semaines de tests mensongers : une origine
      # interdite ne doit produire AUCUN envoi, et jamais une confirmation.
      - name: php --version
        run: php -v

      - name: tests du formulaire
        run: npm run test:php

      # `check` ne construit pas le site. Or le build attrape ce que le
      # typecheck ne voit pas — une page qui ne se prérend pas, une route du
      # registre sans fichier, une image manquante.
      #
      # NEXT_PUBLIC_SITE_URL est posée pour que canonical, sitemap et robots
      # soient produits dans les mêmes conditions qu'en production. Sans elle,
      # le build vise localhost et robots.txt bascule en `Disallow: /`.
      #
      # NEXT_PUBLIC_SITE_OPEN reste à sa valeur par défaut (fermé) : le paquet
      # produit ici n'est jamais publié, et un `noindex` de plus ne coûte rien
      # alors qu'un paquet ouvert traînant dans un artefact peut tromper.
      - name: next build
        run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.argon-mobility.com

      # Contrôle éditorial — BLOQUANT depuis le 26/08/2026.
      #
      # Il était informatif à sa mise en place le matin même : il sortait en
      # code 0 quoi qu'il signale, et signalait dix affirmations permanentes
      # dans `src/lib/tarifs.ts` que personne ne pouvait corriger. Les dix ont
      # été arbitrées l'après-midi — exemption nommée et motivée dans
      # `scripts/controle-editorial.mjs`, portant sur les trois seuls noms de
      # fonctions du comparatif contractuel — et le script rend désormais un
      # code de sortie.
      #
      # Font échouer : vocabulaire interdit affirmé, formule comptable
      # reformulée, apostrophe typographique, maquette sans légende.
      # Ne fait PAS échouer : `CAPTURE_TABLEAU_DE_BORD` cessant d'être `null`,
      # qui serait une bonne nouvelle et non une faute.
      - name: npm run controle
        run: npm run controle
