# Configuration Apache du conteneur de la vitrine.
# Montée dans /etc/apache2/conf-enabled/ — chargée à chaque démarrage.

# ⚠️ SANS CECI, LE .htaccess EST IGNORÉ EN SILENCE.
# L'image php:apache fixe AllowOverride à None : Apache lit alors le fichier,
# n'applique aucune de ses directives, et ne signale rien. Le symptôme n'est pas
# une erreur mais un site dont toutes les pages répondent 404, sauf l'accueil —
# parce que les URLs sans extension reposent entièrement sur la réécriture.
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# Le conteneur est derrière Caddy : sans cela, les journaux d'Apache
# n'enregistrent que l'adresse interne du proxy, identique pour tous les
# visiteurs. Caddy renseigne X-Forwarded-For.
<IfModule mod_remoteip.c>
    RemoteIPHeader X-Forwarded-For
</IfModule>

# Silence l'avertissement « Could not reliably determine the server's fully
# qualified domain name » au démarrage. Sans effet sur le service : c'est Caddy
# qui décide du domaine servi.
ServerName vitrine.local

# Ne pas annoncer la version d'Apache ni celle de PHP dans les réponses.
ServerTokens Prod
ServerSignature Off
